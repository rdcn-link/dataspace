<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ocean · 海洋联动分析</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5f8;color:#163344;font:14px system-ui,sans-serif}header{background:#123a4b;color:white;padding:22px 28px}header h1{font-size:23px;margin:0 0 6px}header p{opacity:.8;margin:0}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 24px;background:white;border-bottom:1px solid #d8e4eb}.toolbar label{display:flex;align-items:center;gap:8px}select,button{border:1px solid #bdcfd8;background:white;color:#143c50;border-radius:6px;padding:7px}button{cursor:pointer}button.active{background:#136f89;color:white}.controls{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:16px 24px}input[type=range]{width:100%;accent-color:#167d97}main{padding:0 24px 24px;display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.panel{background:white;border:1px solid #d8e4eb;border-radius:10px;padding:16px;min-width:0}.panel h2{font-size:16px;margin:0 0 6px}.panel p{font-size:12px;color:#587382;min-height:18px;margin:4px 0 8px}canvas{display:block;width:100%;height:280px;touch-action:none}#map{height:340px;cursor:crosshair}.wide{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.hint{padding:0 24px 12px;color:#456777;font-size:12px}output{font-variant-numeric:tabular-nums}#error{color:#a22} @media(max-width:760px){main,.controls{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar{gap:8px}header{padding:18px}}
</style></head><body><header><h1>Ocean / 海洋联动分析</h1><p>地图 · 时间 · 深度 · 剖面 — 同一份数据，同一组选择</p></header>
<div class="toolbar"><label>地图变量 <select id="variable"></select></label><button class="active" data-mode="point">选点</button><button data-mode="box">框选区域</button><button data-mode="line">绘制断面</button><button id="reset">重置区域</button><label><input type="checkbox" id="currents">海流箭头</label><button id="play">播放时间</button></div>
<div class="controls"><label>时间 <output id="timeLabel"></output><input aria-label="时间" id="time" type="range" min="0" value="0" step="1"></label><label><span id="depthTitle"></span> <output id="depthLabel"></output><input aria-label="深度" id="depth" type="range" min="0" value="0" step="1"></label></div>
<p class="hint" id="quality"></p><p class="hint" id="error" role="alert"></p>
<main><section class="panel"><h2>水层分布</h2><p id="mapInfo">点击查看剖面；框选或拖动绘制断面。</p><canvas id="map" aria-label="经纬度水层地图"></canvas><div aria-hidden="true" style="height:8px;border-radius:4px;background:linear-gradient(to right,hsl(230 67% 36%),hsl(175 67% 40.5%),hsl(120 67% 45%),hsl(65 67% 49.5%),hsl(10 67% 54%))"></div><p id="scale"></p></section>
<section class="panel"><div class="row"><h2>选点垂直剖面</h2><button data-export="profile">导出 CSV</button></div><p id="pointInfo"></p><canvas id="profile"></canvas></section>
<section class="panel"><div class="row"><h2>区域平均时间序列</h2><button data-export="series">导出 CSV</button></div><p id="regionInfo"></p><canvas id="series"></canvas></section>
<section class="panel"><div class="row"><h2>沿线垂直断面</h2><button data-export="section">导出 CSV</button></div><p id="sectionInfo">选择“绘制断面”后，在地图上拖动指定两个端点。</p><canvas id="section"></canvas></section>
<section class="panel wide"><div class="row"><h2>温盐关系</h2><button data-export="ts">导出 CSV</button></div><div class="toolbar"><label>温度 <select id="temperature"></select></label><label>盐度 <select id="salinity"></select></label></div><p id="tsInfo"></p><canvas id="ts"></canvas></section></main>
<script id="ocean-data" type="application/json">/*OCEAN_DATA*/</script><script>/*OCEAN_MATH*/</script><script>/*OCEAN_UI*/</script></body></html>
