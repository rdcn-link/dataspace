# Host-level Nginx reverse proxy for AI-DataSeek (IP access, port 80 -> 7000)
#
# Prerequisites on the host:
#   sudo apt install -y nginx
#   sudo cp nginx-kiz.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/nginx-kiz.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# If you don't want Nginx at all, just access http://172.16.7.81:7000 directly
# (the frontend container already exposes port 7000 on the host).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass         http://127.0.0.1:7000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (chat sessions)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Large uploads (dataset files up to 20G)
        client_max_body_size 20G;

        # Long timeouts for streaming responses
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}
