                desc: '支持SEGs功能研究与对比分析可视化',
                intro: `<p>该服务提供稳定表达基因（SEGs）的功能研究与对比分析可视化功能。</p>
                        <p class="mt-2">帮助研究人员识别和分析在特定条件下稳定表达的基因。</p>
                        <ul class="list-disc list-inside mt-2 space-y-1">
                            <li>SEGs识别与注释</li>
                            <li>多条件对比分析</li>
                            <li>可视化图表生成</li>
                        </ul>`,
                source: 'bdbe.cn kun 单细胞可视化平台',
                likes: 11200,
                uses: 743,
                usageLogs: [
                    { prompt: '分析SEGs功能', time: '5分钟前', status: '成功' },
                    { prompt: '对比基因表达', time: '30分钟前', status: '成功' },
                    { prompt: '生成可视化图表', time: '1小时前', status: '成功' },
                    { prompt: '筛选稳定表达基因', time: '2小时前', status: '成功' },
                    { prompt: '分析基因功能', time: '3小时前', status: '成功' }
                ],
                evaluations: [
                    { user: '何**', content: '分析功能很强大', time: '1小时前' },
                    { user: '郭**', content: '图表很漂亮', time: '2小时前' },
                    { user: '林**', content: '数据准确', time: '昨天' }
                ],
                stats: {
                    labels: ['2026-04-04', '2026-04-05', '2026-04-06', '2026-04-07', '2026-04-08', '2026-04-09', '2026-04-10'],
                    views: [180, 220, 280, 250, 320, 140, 170],
                    uses: [75, 92, 118, 105, 135, 58, 72]
                }
            }
        };

        let currentService = null;
        let isLiked = false;
        let chart = null;

        function getServiceFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('service') || '化学物质智能检索';
        }

        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'k';
            }
            return num.toString();
        }

        function renderServiceDetail(serviceName) {
            const data = serviceData[serviceName];
            if (!data) return;

            currentService = serviceName;

            document.getElementById('serviceIcon').className = `w-12 h-12 ${data.bgColor} rounded-lg flex items-center justify-center ${data.textColor}`;
            document.getElementById('serviceIcon').innerHTML = `<iconify-icon class="text-3xl" icon="${data.icon}"></iconify-icon>`;
            document.getElementById('serviceTag').textContent = data.tag;
            document.getElementById('serviceTitle').textContent = data.title;
            document.getElementById('serviceDesc').textContent = data.desc;
            document.getElementById('serviceIntro').innerHTML = data.intro;
            document.getElementById('serviceSource').textContent = data.source;
            document.getElementById('likeNum').textContent = formatNumber(data.likes);
            document.getElementById('useNum').textContent = formatNumber(data.uses);
            document.getElementById('likeCount').textContent = data.likes;

            renderUsageLogs(data.usageLogs);
            renderEvaluations(data.evaluations);
            renderChart(data.stats);
        }

        function renderUsageLogs(logs) {
            const container = document.getElementById('usageLog');
            container.innerHTML = logs.map((log, index) => `
                <tr class="hover:bg-slate-50">
                    <td class="py-2 pr-3 text-slate-400">${index + 1}</td>
                    <td class="py-2 pr-3 text-slate-600">${log.prompt}</td>
                    <td class="py-2 pr-3 text-slate-400">${log.time}</td>
                    <td class="py-2">
                        <span class="px-2 py-0.5 text-xs font-medium ${log.status === '成功' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} rounded-full">${log.status}</span>
                    </td>
                </tr>
            `).join('');
        }

        function filterUsageLogs() {
            const query = document.getElementById('usageSearchInput').value.toLowerCase();
            const currentLogs = serviceData[currentService]?.usageLogs || [];
            const filtered = currentLogs.filter(log => log.prompt.toLowerCase().includes(query));
            renderUsageLogs(filtered);
        }

        function renderEvaluations(evals) {
            const container = document.getElementById('evalList');
            container.innerHTML = evals.map((eval, index) => `
                <div class="evaluation-item rounded-xl p-3 transition-colors group">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-sm font-medium text-slate-700">${eval.user}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-slate-400">${eval.time}</span>
                            <button onclick="deleteEvaluation(${index})" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-red-100 rounded-lg transition-all">
                                <iconify-icon class="text-red-400 text-sm" icon="solar:trash-bin-trash-bold-duotone"></iconify-icon>
                            </button>
                        </div>
                    </div>
                    <p class="text-sm text-slate-600">${eval.content}</p>
                </div>
            `).join('');
        }

        function addEvaluation() {
            const input = document.getElementById('newEvalInput');
            const content = input.value.trim();
            if (!content || !currentService) return;

            const newEval = {
                user: '我',
                content: content,
                time: '刚刚'
            };

            serviceData[currentService].evaluations.unshift(newEval);
            input.value = '';
            renderEvaluations(serviceData[currentService].evaluations);
        }

        function deleteEvaluation(index) {
            if (!currentService) return;
            serviceData[currentService].evaluations.splice(index, 1);
            renderEvaluations(serviceData[currentService].evaluations);
        }

        function renderChart(stats) {
            const container = document.getElementById('statsChart');
            
            if (chart) {
                chart.dispose();
            }

            chart = echarts.init(container);
            
            const option = {
                tooltip: {
                    trigger: 'axis'
                },
                legend: {
                    data: ['浏览次数', '使用次数'],
                    top: 0
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    top: '40px',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: stats.labels,
                    axisLine: {
                        lineStyle: {
                            color: '#e0e0e0'
                        }
                    },
                    axisLabel: {
                        color: '#666',
                        rotate: 30
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLine: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        color: '#666'
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    }
                },
                series: [
                    {
                        name: '浏览次数',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        itemStyle: {
                            color: 'rgb(59, 130, 246)'
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(59, 130, 246, 0.3)' },
                                { offset: 1, color: 'rgba(59, 130, 246, 0.05)' }
                            ])
                        },
                        data: stats.views
                    },
                    {
                        name: '使用次数',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        itemStyle: {
                            color: 'rgb(16, 185, 129)'
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(16, 185, 129, 0.3)' },
                                { offset: 1, color: 'rgba(16, 185, 129, 0.05)' }
                            ])
                        },
                        data: stats.uses
                    }
                ]
            };

            chart.setOption(option);
        }

        document.getElementById('likeBtn').addEventListener('click', function() {
            if (!currentService) return;

            const data = serviceData[currentService];
            data.likes += 1;

            document.getElementById('likeCount').textContent = formatNumber(data.likes);
            document.getElementById('likeNum').textContent = formatNumber(data.likes);
        });

        document.addEventListener('DOMContentLoaded', function() {
            const serviceName = getServiceFromURL();
            renderServiceDetail(serviceName);
        });
    </script>
</body>
</html>
