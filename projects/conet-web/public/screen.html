<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="/assets/conet-mark.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协作大屏 · 科诺空间</title><link rel="stylesheet" href="/screen.css"><link rel="stylesheet" href="/website-style.css"><script src="/website-style.js"></script></head><body>
<header class="wall-header"><div class="top-left"><div class="top-stat">数据集 <b id="dataset-total">—</b></div><div class="top-stat">算子 <b id="operator-total">—</b></div></div><div class="wall-title"><h1>科诺空间</h1><time id="clock"></time></div><div class="top-right"><div class="top-stat">作业 <b id="job-total">—</b></div><div class="top-stat">接入节点 <b id="step-total">—</b></div></div></header>
<main class="wall-main"><aside class="left-rail"><section class="wall-panel network-health"><h2><i>◉</i> 科诺空间状态 <span id="connection-state">正在连接</span></h2><div class="health-summary"><div id="health-ring" class="health-ring"><div><strong id="online-rate">—</strong><small>节点接入率</small></div></div><div class="health-counters"><div><span class="counter-icon">◎</span><strong id="online-count">—</strong><small>接入节点</small></div><div><span class="counter-icon warning">△</span><strong id="unavailable-count">—</strong><small>未接入节点</small></div></div></div></section><section class="wall-panel"><h2><i>▦</i> 网络资源</h2><div class="resource-grid"><div><span class="resource-icon">▥</span><b id="cpu">—</b><small>节点平均 CPU</small></div><div><span class="resource-icon">▤</span><b id="memory">—</b><small>JVM 堆内存</small></div><div><span class="resource-icon">▱</span><b id="data-volume">—</b><small>成果文件</small></div></div><div class="resource-note" id="resource-note">资源由节点上报</div></section><section class="wall-panel center-list-panel"><h2><i>◈</i> 网络节点 <span id="node-total">—</span></h2><div id="node-list"></div><div class="simulation-note">数据中心与计算节点</div></section><section class="wall-panel case-panel"><h2><i>⌁</i> 协作案例</h2><div id="case-list"></div></section></aside>
<section class="globe-section"><div class="globe-topline"><span><i class="live-dot"></i> <span id="globe-state">等待网络状态</span></span><span>连接数据 · 协作计算 · 共享发现</span></div><div class="globe-viewport" id="globe-viewport"><canvas id="earth" width="1200" height="1000" aria-label="以中国为中心的地球背景"></canvas><svg id="globe-overlay" viewBox="0 0 1200 1000" preserveAspectRatio="none" role="img" aria-label="数据中心节点和任务数据传输"></svg><aside id="node-detail" aria-label="数据中心详情" hidden><button id="close-node-detail" type="button" aria-label="关闭数据中心详情">×</button><div id="node-detail-content"></div></aside></div><div class="globe-bottom"><div class="globe-key"><span><i></i> 网络节点</span><span title="按累计任务传输量映射线宽，采用对数缩放"> <i class="wire"></i> 数据协作网络</span><span>查看节点与分析服务的协作关系</span></div><div class="globe-controls"><button id="reset-panels" title="恢复左右面板的默认位置">▦ 面板复位</button><button id="reset-view">⌖ 视角重置</button><button id="toggle-labels" aria-pressed="true">节点标注 <span>●</span></button><button id="fullscreen">⛶ 全屏</button></div></div></section>
<aside class="right-rail"><section class="wall-panel jobs-panel"><h2><i>▷</i> 最新作业 <span>实时状态</span></h2><div id="job-list"></div></section><section class="wall-panel"><h2><i>▤</i> 分析数据 <span>数据集</span></h2><div id="dataset-cloud" class="word-cloud"></div></section><section class="wall-panel"><h2><i>⌘</i> 分析算子 <span>分析方法</span></h2><div id="operator-cloud" class="word-cloud"></div></section><section class="wall-panel execution-panel"><h2><i>◷</i> 作业执行 <span id="success-label">—</span></h2><div class="execution-summary"><div id="execution-counts"></div><div id="success-ring" class="success-ring"><strong id="success-rate">—</strong><small>完成任务成功率</small></div></div></section></aside></main><footer><span id="updated">正在获取最新观测</span><span>节点状态与分析任务持续更新</span><span>数据协作 · 分析计算 · 成果共享</span></footer><div id="job-plan-modal" class="job-plan-modal" hidden role="dialog" aria-modal="true" aria-labelledby="job-plan-title"><section class="job-plan-window"><header><div><strong id="job-plan-title">作业物理计划</strong><span id="job-plan-subtitle"></span></div><button id="close-job-plan" aria-label="关闭物理计划">×</button></header><iframe id="job-plan-frame" title="作业物理计划 DAG"></iframe></section></div><script src="/screen-globe.js"></script><script src="/screen.js"></script><script src="/screen-panels.js"></script></body></html>
