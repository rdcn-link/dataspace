         # 微信相关接口
        location /wechat/ {
            proxy_pass http://127.0.0.1:10002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 订单相关接口
        location /order/ {
            proxy_pass http://127.0.0.1:10003;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 用户相关接口
        location /user/ {
            proxy_pass http://127.0.0.1:10002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 用户相关接口
        location /userapi/ {
		    proxy_pass http://127.0.0.1:10002/;  
		    proxy_set_header Host $host;
		    proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header X-Forwarded-Proto $scheme;
		}

        # ============== Pangeo TPDC1 Portal ==============

        # SPA JS/CSS/资源 — 用 ^~ 锁定前缀，防止其他全局正则 location 抢匹配
        location ^~ /pangeo2/assets/ {
            alias /var/www/html/pangeo2/assets/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        # SPA 静态资源根路径（HTML/Fallback）
        location /pangeo2/ {
            alias /var/www/html/pangeo2/;
            try_files $uri $uri/ /pangeo2/index.html;
        }

        # 业务 API → 走 gateway.scichain.cn（DomainWhitelistFilter 会校验 Referer）
        location /pangeo2/api/v1/ {
            proxy_pass https://gateway.scichain.cn/pangeo2/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host gateway.scichain.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 必须透传 Referer，否则 DomainWhitelistFilter 会 403
            proxy_set_header Referer $http_referer;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_read_timeout 600s;
            client_max_body_size 20m;
        }

        # 健康检查 → 走 gateway
        location /pangeo2/health {
            proxy_pass https://gateway.scichain.cn/pangeo2/health;
            proxy_http_version 1.1;
            proxy_set_header Host gateway.scichain.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Dev-Mode $http_x_dev_mode;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
        }

        # JupyterLab iframe + WebSocket -> 必须走 gateway（39.106 无法直连 10.0.82.x）
        # gateway 剥掉 /pangeo2 后交给 pangeo2 nginx（:8082 /jupyter/ -> jupyter:8888）
        location /pangeo2/jupyter/ {
            proxy_pass https://gateway.scichain.cn/pangeo2/jupyter/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host gateway.scichain.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /pangeo2/jupyter;
            # 透传 Referer 让 gateway DomainWhitelistFilter 通过（REPLACE_WITH_EXTERNAL_CONFIG 在白名单）
            proxy_set_header Referer $http_referer;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_read_timeout 86400;
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400;
        }

        # WMS 地图服务 -> 走 gateway（后端 10.0.82.x 公网不可达）
        location ^~ /pangeo2/pangeo-wms/ {
            proxy_pass https://gateway.scichain.cn/pangeo2/pangeo-wms/;
            proxy_http_version 1.1;
            proxy_set_header Host gateway.scichain.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Referer $http_referer;
            proxy_set_header Origin $http_origin;
            proxy_pass_request_headers on;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            client_max_body_size 20m;
            add_header Access-Control-Allow-Origin "https://REPLACE_WITH_EXTERNAL_CONFIG" always;
        }

        # 天地图瓦片 -> 走 gateway（后端 10.0.82.x 公网不可达）
        location /pangeo2/tiles/tianditu/ {
            proxy_pass https://gateway.scichain.cn/pangeo2/tiles/tianditu/;
            proxy_http_version 1.1;
            proxy_set_header Host gateway.scichain.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 瓦片请求来自 img tag，浏览器不带 Authorization，但带 Referer=REPLACE_WITH_EXTERNAL_CONFIG 即可过白名单
            proxy_set_header Referer $http_referer;
            proxy_pass_request_headers on;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

}
