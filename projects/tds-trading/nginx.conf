user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    include /etc/nginx/conf.d/*.conf;

    # HTTP 自动跳 HTTPS
    server {
    if ($host = REPLACE_WITH_EXTERNAL_CONFIG) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen 80;
        listen [::]:80;
        server_name REPLACE_WITH_EXTERNAL_CONFIG;
	location /wechat/ {
        proxy_pass http://127.0.0.1:10002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        }
        return 301 https://$server_name$request_uri;
    

}

    # HTTPS 全站（电脑 + 手机 + 微信 全部通用）
    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  REPLACE_WITH_EXTERNAL_CONFIG;
        root         /var/www/html;

        # 你已经生成好的证书
    ssl_certificate /etc/letsencrypt/live/REPLACE_WITH_EXTERNAL_CONFIG/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_EXTERNAL_CONFIG/privkey.pem; # managed by Certbot

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 前端页面
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
